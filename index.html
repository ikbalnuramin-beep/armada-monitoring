<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Monitoring Armada Luar Kota (Gratis)</title>
  
  <!-- Tailwind CSS & Leaflet Map CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Chart.js untuk Diagram Target -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 rounded-lg shadow-md flex justify-between items-center">
      <h1 class="text-xl font-bold">Monitoring Armada & Perjalanan Luar Kota</h1>
      <span class="text-sm bg-blue-700 px-3 py-1 rounded">Status Server: Online (Gratis)</span>
    </header>

    <!-- Stat Cards & Diagram Target Bulanan -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500">
        <p class="text-sm text-gray-500 font-semibold">Belum Jalan (Hari Ini)</p>
        <p id="stat-belum" class="text-2xl font-bold text-gray-800">1</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
        <p class="text-sm text-gray-500 font-semibold">Sedang Jalan (Lukot)</p>
        <p id="stat-jalan" class="text-2xl font-bold text-gray-800">1</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
        <p class="text-sm text-gray-500 font-semibold">Selesai / Kembali</p>
        <p id="stat-selesai" class="text-2xl font-bold text-gray-800">0</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <p class="text-sm text-gray-500 font-semibold">Target Bulanan (100%)</p>
        <div class="w-full bg-gray-200 rounded-full h-4 mt-2">
          <div id="progress-bar" class="bg-green-500 h-4 rounded-full" style="width: 40%"></div>
        </div>
        <p id="text-target" class="text-xs text-right mt-1 text-gray-600">40 / 100 Trip (40%)</p>
      </div>
    </div>

    <!-- Main Content: Form Supir & Peta Live Staf -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Panel Kiri: Form Input Supir/Kenet -->
      <div class="bg-white p-5 rounded-lg shadow space-y-4">
        <h2 class="text-lg font-bold text-gray-700 border-b pb-2">Form Supir / Kenet</h2>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600">Nama Supir</label>
          <input type="text" id="supir" value="Budi" class="w-full border p-2 rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600">Nama Kenet</label>
          <input type="text" id="kenet" value="Andi" class="w-full border p-2 rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600">Plat Nomor Armada</label>
          <input type="text" id="plat" value="B 9876 XYZ" class="w-full border p-2 rounded text-sm mt-1">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600">Kota Tujuan</label>
          <input type="text" id="tujuan" value="Surabaya" class="w-full border p-2 rounded text-sm mt-1">
        </div>
        
        <div class="pt-2 space-y-2">
          <button onclick="startTracking()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded text-sm">
            ▶ Mulai Jalan & Kirim GPS
          </button>
          <button onclick="stopTracking()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded text-sm">
            ■ Selesai Perjalanan
          </button>
        </div>
      </div>

      <!-- Panel Kanan: Live Map Staf & Diagram -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white p-4 rounded-lg shadow">
          <h2 class="text-lg font-bold text-gray-700 mb-3">Peta Monitoring Armada (Real-time)</h2>
          <div id="map" class="h-80 rounded-lg border"></div>
        </div>

        <!-- Diagram Laporan Bulanan -->
        <div class="bg-white p-4 rounded-lg shadow">
          <h2 class="text-lg font-bold text-gray-700 mb-2">Laporan Progres Target Perjalanan Bulanan</h2>
          <canvas id="chartTarget" class="max-h-48"></canvas>
        </div>
      </div>

    </div>

  </div>

  <script>
    // 1. Inisialisasi Peta Gratis (OpenStreetMap)
    const map = L.map('map').setView([-6.175392, 106.827153], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker;
    let watchId;

    // Simulation Data Staf Kantor
    function updateMarker(lat, lng, info) {
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${info.plat}</b><br>Supir: ${info.supir}<br>Kenet: ${info.kenet}<br>Tujuan: ${info.tujuan}`)
        .openPopup();
      map.setView([lat, lng], 10);
    }

    // 2. Fungsi Kirim Lokasi Supir via Browser Geolocation API
    function startTracking() {
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition((position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          const info = {
            supir: document.getElementById('supir').value,
            kenet: document.getElementById('kenet').value,
            plat: document.getElementById('plat').value,
            tujuan: document.getElementById('tujuan').value
          };

          // Update Tampilan Peta Staf
          updateMarker(lat, lng, info);
          
          // Update Status Ringkasan
          document.getElementById('stat-belum').innerText = '0';
          document.getElementById('stat-jalan').innerText = '2';
          
          alert("GPS Berhasil Aktif & Lokasi Terkirim!");
        }, (error) => {
          alert("Gagal mengambil lokasi GPS. Pastikan Izin Akses Lokasi Diizinkan.");
        }, { enableHighAccuracy: true });
      } else {
        alert("Browser HP tidak mendukung tracking GPS.");
      }
    }

    function stopTracking() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      alert("Perjalanan Selesai!");
      document.getElementById('stat-jalan').innerText = '1';
      document.getElementById('stat-selesai').innerText = '1';
    }

    // 3. Diagram Laporan Bulanan (Chart.js)
    const ctx = document.getElementById('chartTarget').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Minggu 1', 'Minggu 2', 'Minggu 3', 'Minggu 4'],
        datasets: [{
          label: 'Realisasi Trip Lukot',
          data: [10, 15, 15, 0],
          backgroundColor: '#3B82F6'
        }, {
          label: 'Target Trip (100 Per Bulan)',
          data: [25, 25, 25, 25],
          backgroundColor: '#E5E7EB'
        }]
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true } }
      }
    });
  </script>
</body>
</html>
